name: Nginx Setup

on:
  push:
    branches:
      - feat/nginx
  workflow_dispatch:

jobs:
  setup-nginx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy Nginx config to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: ./nginx.conf
          target: /tmp/nginx.conf

      - name: Backup old config, replace, and reload Nginx
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            # Backup เดิมแบบ timestamp กันพลาด
            sudo cp /etc/nginx/nginx.conf /etc/nginx/nginx.conf.backup.$(date +%F_%T)
            # (Optional) เช็ค syntax ก่อน overwrite
            sudo cp /tmp/nginx.conf /etc/nginx/nginx.conf.test
            sudo nginx -t -c /etc/nginx/nginx.conf.test
            # Overwrite ของจริง
            sudo mv /tmp/nginx.conf /etc/nginx/nginx.conf
            sudo nginx -t
            sudo systemctl reload nginx
            sudo rm -f /etc/nginx/nginx.conf.test
            sudo rm -f /tmp/nginx.conf
