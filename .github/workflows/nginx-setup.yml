name: Nginx Setup

on:
  push:
    branches:
      - feat/nginx # Only runs when you push to this branch
  workflow_dispatch: # Allows manual run from GitHub UI

jobs:
  setup-nginx:
    runs-on: ubuntu-latest
    steps:
      # Optional: Only needed if nginx.conf is inside your repo (not required if you upload it manually)
      - uses: actions/checkout@v4

      - name: Copy Nginx config to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: ./nginx.conf
          target: /tmp/nginx.conf

      - name: Backup old config, replace, and reload Nginx
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e                                     # Stop if any command fails
            sudo cp /etc/nginx/nginx.conf /etc/nginx/nginx.conf.backup
            sudo mv /tmp/nginx.conf /etc/nginx/nginx.conf
            sudo nginx -t
            sudo systemctl reload nginx
