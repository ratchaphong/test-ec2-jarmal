version: '3.8'
services:
  db:
    image: mysql:8
    container_name: blog-db
    ports:
      - '3306:3306'
    environment:
      MYSQL_DATABASE: blog
      MYSQL_ROOT_PASSWORD: rootpassword # password ของ root
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data:
