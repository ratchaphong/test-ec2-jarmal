# กำหนด user ที่ใช้รัน nginx process
user www-data;

# ให้ nginx สร้าง worker ตามจำนวน core CPU
worker_processes auto;

# กำหนดตำแหน่งไฟล์ PID (process id)
pid /run/nginx.pid;

events {
    # กำหนดจำนวน connection สูงสุดต่อ 1 worker process
    worker_connections 1024;
}

http {
    # include ไฟล์ชนิด mime (เช่น .css, .js, .png)
    include       /etc/nginx/mime.types;

    # ถ้าไม่รู้ประเภทไฟล์ ให้เป็น octet-stream (binary)
    default_type  application/octet-stream;

    # เปิดใช้ sendfile เพื่อให้ประสิทธิภาพดีขึ้นเวลาเสิร์ฟไฟล์ static
    sendfile        on;

    # ตั้งเวลา keepalive สำหรับ connection ที่เปิดค้าง
    keepalive_timeout 65;

    server {
        # รับ request ที่ port 80 (HTTP ปกติ)
        listen 80;

        # รับ hostname หรือ IP อะไรก็ได้ (_ คือ wildcard)
        server_name _;    # Accept any hostname or IP

        location / {
            # ส่งต่อ (proxy) ทุก request ไปที่ http://localhost:4000 (แอป NestJS)
            proxy_pass         http://localhost:4000;

            # กำหนด version HTTP สำหรับ proxy
            proxy_http_version 1.1;

            # ส่ง header ที่จำเป็นไปยัง backend (NestJS)
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
